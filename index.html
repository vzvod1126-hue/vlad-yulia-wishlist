<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Влад 🕷️ + Юля 🎀 — вишлист</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ТУТ МОЖНО ПОМЕНЯТЬ ФОН */
html, body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
  /* Если хочешь свою картинку, раскомментируй строку ниже (убери /* и */) и вставь ссылку */
  /* background: url('ССЫЛКА_НА_ТВОЮ_КАРТИНКУ') center/cover fixed; */
  background: linear-gradient(160deg, #FFF5F8 0%, #FFE0EC 100%); 
  color: #3a2836; 
  min-height: 100vh; 
  -webkit-font-smoothing: antialiased; 
}

#root { min-height: 100vh; }
.center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-form { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 32px 24px; border-radius: 24px; box-shadow: 0 20px 60px rgba(255,107,157,0.15); width: 100%; max-width: 400px; text-align: center; border: 2px solid #FFD6E4; animation: fadeIn 0.5s ease-out; }
.login-form h1 { font-size: 26px; margin-bottom: 4px; }
.subtitle { color: #8a6b7a; margin-bottom: 24px; font-size: 14px; }
.login-form input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 2px solid #FFD6E4; border-radius: 12px; font-size: 16px; background: #FFF9FB; outline: none; transition: border-color 0.3s; }
.login-form input:focus { border-color: #FF6B9D; }
.login-form button { width: 100%; padding: 14px; background: linear-gradient(135deg, #FF6B9D, #FF8FB8); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: transform 0.1s; }
.login-form button:active { transform: scale(0.98); }
.login-form button:disabled { opacity: 0.6; }
.error { color: #E62429; font-size: 14px; margin-bottom: 8px; }

.app { max-width: 1100px; margin: 0 auto; padding: 16px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 16px; border-bottom: 2px solid #FFD6E4; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
header h1 { font-size: 20px; }
.logout { padding: 8px 14px; background: rgba(255, 255, 255, 0.8); border: 2px solid #FFD6E4; border-radius: 10px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
.logout:hover { background: white; }

.add-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #E62429, #FF6B9D); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(230,36,41,0.25); transition: transform 0.1s, box-shadow 0.2s; }
.add-btn:active { transform: scale(0.98); box-shadow: 0 2px 10px rgba(230,36,41,0.2); }

.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .lists { grid-template-columns: 1fr; } }
.column { background: rgba(255,255,255,0.7); backdrop-filter: blur(5px); border-radius: 20px; padding: 16px; border: 2px solid #FFD6E4; }
.column h2 { font-size: 18px; margin-bottom: 12px; }
.empty { color: #8a6b7a; font-size: 14px; text-align: center; padding: 20px 0; }

.card { background: white; border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 2px solid #FFD6E4; box-shadow: 0 4px 12px rgba(255,107,157,0.08); transition: transform 0.2s, box-shadow 0.2s; animation: fadeIn 0.4s ease-out; }
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,107,157,0.15); }
.card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
.card h3 { font-size: 16px; margin-bottom: 6px; }
.card p { font-size: 14px; color: #6a4a5a; margin-bottom: 8px; }
.card.purchased { opacity: 0.7; border-style: dashed; background: #FFF9FB; }
.card.purchased h3 { text-decoration: line-through; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.meta span { font-size: 12px; padding: 4px 10px; background: #FFF0F5; border-radius: 20px; color: #a44a6a; }
.card a { color: #E62429; font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 5px; }
.card a:hover { text-decoration: underline; }

.buy-btn { margin-top: 10px; width: 100%; padding: 10px; background: #FFF0F5; border: 2px solid #FF6B9D; color: #E62429; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; transition: background 0.2s, color 0.2s; }
.buy-btn:hover { background: #FF6B9D; color: white; }

.modal-bg { position: fixed; inset: 0; background: rgba(58,40,54,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 100; animation: fadeInBg 0.3s ease-out; }
@media (min-width: 700px) { .modal-bg { align-items: center; padding: 20px; } }
.modal { background: white; padding: 24px 20px; border-radius: 24px 24px 0 0; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: slideUpMobile 0.3s ease-out; }
@media (min-width: 700px) { .modal { border-radius: 24px; animation: slideUpDesktop 0.3s ease-out; } }
.modal h2 { margin-bottom: 16px; }
.modal label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: #6a4a5a; }
.modal input, .modal textarea, .modal select { width: 100%; padding: 10px 12px; margin-top: 6px; border: 2px solid #FFD6E4; border-radius: 10px; font-size: 15px; background: #FFF9FB; outline: none; font-family: inherit; transition: border-color 0.2s; }
.modal input:focus, .modal textarea:focus, .modal select:focus { border-color: #FF6B9D; }
.modal textarea { min-height: 70px; resize: vertical; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
.modal-actions button:hover { opacity: 0.9; }
.modal-actions button[type="button"] { background: #F5E9EE; color: #6a4a5a; }
.modal-actions button[type="submit"] { background: linear-gradient(135deg, #FF6B9D, #FF8FB8); color: white; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUpMobile { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes slideUpDesktop { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect } = React;
const { createClient } = window.supabase;

const SUPABASE_URL = 'https://ufxkmdyqggtzehdgrlrq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qztayszdGjUWfJ3vdJiNLA_7yLft1vo';

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CATEGORIES = { under2000: '💰 до 2000', big: '💎 крупный', handmade: '🎨 handmade', experience: '✨ впечатление', other: '🎁 прочее' };
const PRIORITIES = { must: '🔥 очень хочу', nice: '🙂 было бы славно', dream: '🌟 мечта' };

function App() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [partner, setPartner] = useState(null);
  const [gifts, setGifts] = useState([]);
  const [showForm, setShowForm] = useState(false);

  useEffect(() => {
    db.auth.getSession().then(({ data }) => { setSession(data.session); setLoading(false); });
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => { if (session) loadData(); }, [session]);

  async function loadData() {
    const me = session.user.id;
    const { data: profiles } = await db.from('profiles').select('*');
    setProfile(profiles?.find(p => p.id === me) || null);
    setPartner(profiles?.find(p => p.id !== me) || null);
    const { data: g, error } = await db.rpc('get_gifts');
    if (error) { console.error(error); return; }
    setGifts(g || []);
  }

  async function togglePurchase(giftId) {
    const { error } = await db.rpc('toggle_purchase', { gift_id: giftId });
    if (error) { alert('Ошибка: ' + error.message); return; }
    await loadData();
  }

  async function deleteGift(giftId) {
    if (!window.confirm('Точно удалить этот подарок?')) return;
    const { error } = await db.from('gifts').delete().eq('id', giftId);
    if (error) { alert('Ошибка удаления: ' + error.message); return; }
    await loadData();
  }

  if (loading) return React.createElement('div', { className: 'center' }, 'Загрузка 💗');
  if (!session) return React.createElement(Login);

  const myWishlist = gifts.filter(g => g.for_user === session.user.id);
  const partnerWishlist = gifts.filter(g => g.for_user !== session.user.id);

  return React.createElement('div', { className: 'app' },
    React.createElement('header', null,
      React.createElement('h1', null, (profile?.emoji || '💗') + ' ' + (profile?.name || 'Я') + ' + ' + (partner?.emoji || '💗') + ' ' + (partner?.name || 'Партнёр')),
      React.createElement('button', { className: 'logout', onClick: () => db.auth.signOut() }, 'Выйти')
    ),
    React.createElement('button', { className: 'add-btn', onClick: () => setShowForm(true) }, '➕ Добавить подарок'),
    showForm && React.createElement(GiftForm, { me: session.user.id, partner: partner, onClose: () => setShowForm(false), onSaved: () => { setShowForm(false); loadData(); } }),
    React.createElement('section', { className: 'lists' },
      React.createElement('div', { className: 'column' },
        React.createElement('h2', null, '🎁 Мой вишлист'),
        myWishlist.length === 0 && React.createElement('p', { className: 'empty' }, 'Пока пусто. Добавь мечту! 💭'),
        myWishlist.map(g => React.createElement(GiftCard, { 
          key: g.id, 
          gift: g, 
          mode: 'mine', 
          onDelete: (g.created_by === session.user.id) ? () => deleteGift(g.id) : null 
        }))
      ),
      React.createElement('div', { className: 'column' },
        React.createElement('h2', null, '💝 Хочу подарить ' + (partner?.emoji || '') + ' ' + (partner?.name || '')),
        partnerWishlist.length === 0 && React.createElement('p', { className: 'empty' }, 'Пока пусто 🎀'),
        partnerWishlist.map(g => React.createElement(GiftCard, { 
          key: g.id, 
          gift: g, 
          mode: 'partner', 
          onToggle: () => togglePurchase(g.id), 
          onDelete: (g.created_by === session.user.id) ? () => deleteGift(g.id) : null 
        }))
      )
    )
  );
}

function Login() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleLogin(e) {
    e.preventDefault(); setBusy(true); setError('');
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
    setBusy(false);
  }

  return React.createElement('div', { className: 'center' },
    React.createElement('form', { className: 'login-form', onSubmit: handleLogin },
      React.createElement('h1', null, '🕷️ Влад + Юля 🎀'),
      React.createElement('p', { className: 'subtitle' }, 'Наш семейный вишлист'),
      React.createElement('input', { type: 'email', placeholder: 'email', value: email, onChange: e => setEmail(e.target.value), required: true }),
      React.createElement('input', { type: 'password', placeholder: 'пароль', value: password, onChange: e => setPassword(e.target.value), required: true }),
      error && React.createElement('p', { className: 'error' }, error),
      React.createElement('button', { type: 'submit', disabled: busy }, busy ? '...' : 'Войти 💗')
    )
  );
}

function GiftCard({ gift, mode, onToggle, onDelete }) {
  return React.createElement('div', { className: 'card ' + (gift.is_purchased ? 'purchased' : '') },
    gift.image_url && React.createElement('img', { src: gift.image_url, alt: gift.title }),
    React.createElement('h3', null, gift.title),
    gift.description && React.createElement('p', null, gift.description),
    React.createElement('div', { className: 'meta' },
      gift.price != null && React.createElement('span', null, gift.price + ' ₽'),
      gift.category && React.createElement('span', null, CATEGORIES[gift.category]),
      gift.priority && React.createElement('span', null, PRIORITIES[gift.priority])
    ),
    gift.url && React.createElement('a', { href: gift.url, target: '_blank', rel: 'noopener noreferrer' }, 'Открыть ссылку →'),
    mode === 'partner' && onToggle && React.createElement('button', { className: 'buy-btn', onClick: onToggle }, gift.is_purchased ? '✅ Куплено (отменить?)' : '🛒 Отметить купленным'),
    onDelete && React.createElement('button', { onClick: onDelete, style: {marginTop: 8, background: 'none', border: 'none', color: '#c97', fontSize: 12, cursor: 'pointer', width: '100%', textAlign: 'right'} }, 'удалить')
  );
}

function GiftForm({ me, partner, onClose, onSaved }) {
  const [form, setForm] = useState({ title: '', description: '', url: '', price: '', category: '', priority: '', for_user: me });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function handleSubmit(e) {
    e.preventDefault(); setBusy(true); setErr('');
    const payload = {
      title: form.title, description: form.description || null, url: form.url || null,
      price: form.price ? Number(form.price) : null, category: form.category || null,
      priority: form.priority || null, for_user: form.for_user, created_by: me
    };
    const { error } = await db.from('gifts').insert(payload);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onSaved();
  }

  return React.createElement('div', { className: 'modal-bg', onClick: onClose },
    React.createElement('form', { className: 'modal', onClick: e => e.stopPropagation(), onSubmit: handleSubmit },
      React.createElement('h2', null, 'Новый подарок'),
      React.createElement('label', null, 'Кому?',
        React.createElement('select', { value: form.for_user, onChange: e => setForm({...form, for_user: e.target.value}) },
          React.createElement('option', { value: me }, 'Мне (в мой вишлист)'),
          partner && React.createElement('option', { value: partner.id }, partner.emoji + ' ' + partner.name)
        )
      ),
      React.createElement('label', null, 'Название*', React.createElement('input', { required: true, value: form.title, onChange: e => setForm({...form, title: e.target.value}) })),
      React.createElement('label', null, 'Описание', React.createElement('textarea', { value: form.description, onChange: e => setForm({...form, description: e.target.value}) })),
      React.createElement('label', null, 'Ссылка', React.createElement('input', { type: 'url', value: form.url, onChange: e => setForm({...form, url: e.target.value}), placeholder: 'https://...' })),
      React.createElement('label', null, 'Цена, ₽', React.createElement('input', { type: 'number', value: form.price, onChange: e => setForm({...form, price: e.target.value}) })),
      React.createElement('label', null, 'Категория',
        React.createElement('select', { value: form.category, onChange: e => setForm({...form, category: e.target.value}) },
          React.createElement('option', { value: '' }, '—'),
          Object.entries(CATEGORIES).map(([k,v]) => React.createElement('option', { key: k, value: k }, v))
        )
      ),
      React.createElement('label', null, 'Приоритет',
        React.createElement('select', { value: form.priority, onChange: e => setForm({...form, priority: e.target.value}) },
          React.createElement('option', { value: '' }, '—'),
          Object.entries(PRIORITIES).map(([k,v]) => React.createElement('option', { key: k, value: k }, v))
        )
      ),
      err && React.createElement('p', { className: 'error' }, err),
      React.createElement('div', { className: 'modal-actions' },
        React.createElement('button', { type: 'button', onClick: onClose }, 'Отмена'),
        React.createElement('button', { type: 'submit', disabled: busy }, busy ? '...' : 'Сохранить 💗')
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
