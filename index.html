<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
  background: linear-gradient(45deg, #FFF5F8, #FFE0EC, #FFD6E4, #FFF5F8);
  background-size: 300% 300%;
  animation: gradientBG 10s ease infinite;
  color: #3a2836; 
  min-height: 100vh; 
  overflow-x: hidden;
}

#root { min-height: 100vh; position: relative; }

.polaroid-board { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.polaroid { position: absolute; background: white; padding: 10px 10px 35px 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border-radius: 4px; width: 210px; }
.polaroid img { width: 100%; height: auto; display: block; border-radius: 2px; object-fit: cover; animation: fadeImg 1s ease-in-out; }
.polaroid::before { content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 80px; height: 22px; background: rgba(255, 255, 255, 0.6); box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
.pol-1 { top: 10%; left: 1%; transform: rotate(-6deg); }
.pol-2 { top: 8%; right: 1%; transform: rotate(5deg); width: 230px; }
.pol-3 { bottom: 5%; left: 2%; transform: rotate(7deg); width: 220px; }
.pol-4 { bottom: 10%; right: 2%; transform: rotate(-5deg); width: 210px; }

@media (max-width: 1000px) {
  .polaroid { width: 130px; padding: 6px 6px 20px 6px; opacity: 0.8; }
  .polaroid::before { width: 50px; height: 15px; top: -8px; }
  .pol-1 { top: 5%; left: -40px; transform: rotate(-15deg); }
  .pol-2 { top: 15%; right: -40px; transform: rotate(15deg); }
  .pol-3 { bottom: 15%; left: -40px; transform: rotate(10deg); }
  .pol-4 { bottom: 5%; right: -40px; transform: rotate(-10deg); }
  .column { background: rgba(255, 255, 255, 0.96); }
  header { background: rgba(255, 255, 255, 0.96); }
}

.loading-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #FFF5F8, #FFD6E4); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 20px; text-align: center; }
.loading-screen h2 { font-size: 24px; margin-bottom: 20px; color: #E62429; }
.loading-bar-bg { width: 80%; max-width: 300px; height: 20px; background: white; border-radius: 20px; border: 2px solid #FF6B9D; overflow: hidden; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(255,107,157,0.2); }
.loading-bar-fill { height: 100%; background: linear-gradient(90deg, #FF6B9D, #E62429); width: 0%; transition: width 0.1s; border-radius: 20px; }

.center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; z-index: 10; }
.login-form { background: rgba(255, 255, 255, 0.95); padding: 32px 24px; border-radius: 24px; box-shadow: 0 20px 60px rgba(255,107,157,0.15); width: 100%; max-width: 400px; text-align: center; border: 2px solid #FFD6E4; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(10px); }
.login-form h1 { font-size: 24px; margin-bottom: 4px; }

.info-panel { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.timer-box { flex: 2; min-width: 250px; background: rgba(255,255,255,0.9); padding: 14px 20px; border-radius: 16px; border: 2px solid #FFD6E4; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }

.actions-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

.add-btn:active, .surprise-btn:active { transform: scale(0.95); }

.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .lists { grid-template-columns: 1fr; } }
.column { border-radius: 20px; padding: 16px; border: 2px solid #FFD6E4; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.column h2 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: #E62429; }
.empty { color: #8a6b7a; font-size: 14px; text-align: center; padding: 20px 0; }

.card { background: white; border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 2px solid #FFD6E4; box-shadow: 0 4px 12px rgba(255,107,157,0.08); animation: slideInUp 0.4s ease-out forwards; opacity: 0; transition: transform 0.2s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255,107,157,0.2); }

.badge.cat-under2000 { background: #FF9F1C; }
.badge.cat-big { background: #E62429; }
.badge.cat-handmade { background: #2EC4B6; }
.badge.cat-experience { background: #9B5DE5; }

.badge.prio-nice { background: #3A86FF; }
.badge.prio-dream { background: #FFBE0B; color: #3a2836; }

.card a { color: #E62429; font-size: 13px; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 10px; }
.card a:hover { text-decoration: underline; }

.card-actions { display: flex; gap: 8px; margin-top: 10px; }
.edit-btn { flex: 1; padding: 10px; background: #F0F4FF; border: 1px solid #3A86FF; color: #3A86FF; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.edit-btn:active { transform: scale(0.95); background: #3A86FF; color: white; }
.delete-btn { flex: 1; padding: 10px; background: #FFF0F5; border: 1px solid #E62429; color: #E62429; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.delete-btn:active { transform: scale(0.95); background: #E62429; color: white; }

.buy-btn { width: 100%; padding: 10px; background: #FFF0F5; border: 2px solid #FF6B9D; color: #E62429; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; transition: 0.2s; }
.buy-btn:active { transform: scale(0.95); background: #FF6B9D; color: white; }

.modal-bg { position: fixed; inset: 0; background: rgba(58,40,54,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 100; animation: fadeIn 0.3s ease-out; backdrop-filter: blur(3px); }
@media (min-width: 700px) { .modal-bg { align-items: center; padding: 20px; } }

@media (min-width: 700px) { .modal { border-radius: 24px; animation: popIn 0.3s ease-out; } }
.modal h2 { margin-bottom: 16px; color: #E62429; text-align: center; }
.modal label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: #6a4a5a; }
.modal input, .modal textarea, .modal select { width: 100%; padding: 10px 12px; margin-top: 6px; border: 2px solid #FFD6E4; border-radius: 10px; font-size: 15px; background: #FFF9FB; outline: none; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
.modal-actions button[type="button"] { background: #F5E9EE; color: #6a4a5a; }
.modal-actions button[type="submit"] { background: linear-gradient(135deg, #FF6B9D, #FF8FB8); color: white; }
.modal-actions button:active { transform: scale(0.95); }

.surprise-result { text-align: center; padding: 20px 0; }
.surprise-result .icon { font-size: 50px; margin-bottom: 10px; animation: popIn 0.5s; }
.surprise-result h3 { font-size: 22px; color: #E62429; margin-bottom: 10px; }

@keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
@keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUpMobile { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fadeImg { 0% { opacity: 0.3; } 100% { opacity: 1; } }
</style>

<body>
<div id="root"></div>
<script>
const { useState, useEffect } = React;
const { createClient } = window.supabase;

const SUPABASE_URL = 'https://ufxkmdyqggtzehdgrlrq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qztayszdGjUWfJ3vdJiNLA_7yLft1vo';

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CATEGORIES = { under2000: '💰 до 2000', big: '💎 крупный', handmade: '🎨 handmade', experience: '✨ впечатление', other: '🎁 прочее' };
const PRIORITIES = { must: '🔥 очень хочу', nice: '🙂 было бы славно', dream: '🌟 мечта' };

const SPIDER_AVATAR = 'https://i.postimg.cc/nsKzLvcG/e68292b7dce9918224d7a43246c4f4f6-(1).jpg';
const KITTY_AVATAR = 'https://i.postimg.cc/94H0VxVg/04c2467f385af626b7edd1c408596c26.jpg';

const COLLAGES = [
  'https://i.postimg.cc/Pp5YKkbp/IMG-20261108-211354-702.jpg',
  'https://i.postimg.cc/MMpVt80f/IMG-20261108-211354-805.jpg',
  'https://i.postimg.cc/p9ZKDdjj/IMG-20261108-211355-114.jpg',
  'https://i.postimg.cc/06f7pNSG/IMG-20261108-211355-366.jpg'
];

// 📅 ГОД ИСПРАВЛЕН НА 2026
const RELATIONSHIP_START = new Date('2026-08-20T00:00:00'); 

function getRelationshipMilestones() {
  const milestones = [];
  const now = new Date();
  
  for (let i = 1; i <= 10; i++) {
    const months = i * 6;
    const targetDate = new Date(RELATIONSHIP_START.getFullYear(), RELATIONSHIP_START.getMonth() + months, RELATIONSHIP_START.getDate());
    
    if (targetDate > now) {
      let label = '';
      if (months % 12 === 0) {
        const years = months / 12;
        if (years === 1) label = '1 год вместе';
        else if (years > 1 && years < 5) label = years + ' года вместе';
        else label = years + ' лет вместе';
      } else {
        label = months + ' месяцев вместе';
      }
      
      milestones.push({ 
        title: label, 
        date: targetDate.toISOString().split('T')[0], 
        emoji: '💍' 
      });
    }
  }
  return milestones;
}

function formatName(name) {
  if (!name) return '';
  const lower = name.toLowerCase();
  if (lower === 'влад') return 'Владик';
  if (lower === 'юля') return 'Юлька Шпулька';
  return name;
}

function PolaroidBoard() {
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    const interval = setInterval(() => { setOffset(prev => (prev + 1) % COLLAGES.length); }, 5000);
    return () => clearInterval(interval);
  }, []);

  return React.createElement('div', { className: 'polaroid-board' },
    React.createElement('div', { className: 'polaroid pol-1' }, React.createElement('img', { src: COLLAGES[offset % 4], alt: 'collage' })),
    React.createElement('div', { className: 'polaroid pol-2' }, React.createElement('img', { src: COLLAGES[(offset + 1) % 4], alt: 'collage' })),
    React.createElement('div', { className: 'polaroid pol-3' }, React.createElement('img', { src: COLLAGES[(offset + 2) % 4], alt: 'collage' })),
    React.createElement('div', { className: 'polaroid pol-4' }, React.createElement('img', { src: COLLAGES[(offset + 3) % 4], alt: 'collage' }))
  );
}

function LoadingScreen() {
  const [percent, setPercent] = useState(0);
  useEffect(() => {
    const interval = setInterval(() => {
      setPercent(p => {
        if (p >= 100) { clearInterval(interval); return 100; }
        return p + 5;
      });
    }, 50);
    return () => clearInterval(interval);
  }, []);

  return React.createElement('div', { className: 'loading-screen' },
    React.createElement('h2', null, 'Загрузка ' + percent + '%...'),
    React.createElement('div', { className: 'loading-bar-bg' }, React.createElement('div', { className: 'loading-bar-fill', style: { width: percent + '%' } })),
    React.createElement('div', { className: 'love-text' }, 'Моя любовь к тебе всегда 100% ❤️')
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [appLoading, setAppLoading] = useState(true);
  const [dataLoading, setDataLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [partner, setPartner] = useState(null);
  const [gifts, setGifts] = useState([]);
  
  const [showForm, setShowForm] = useState(false);
  const [editingGift, setEditingGift] = useState(null);
  const [randomGift, setRandomGift] = useState(null);

  const [nearestHoliday, setNearestHoliday] = useState(null);
  const [timeLeft, setTimeLeft] = useState('');

  useEffect(() => {
    db.auth.getSession().then(({ data }) => { setSession(data.session); setAppLoading(false); });
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => { if (session) loadData(); else setDataLoading(false); }, [session]);

  useEffect(() => {
    if (!nearestHoliday || !nearestHoliday.date) return;
    const updateTimer = () => {
      const now = new Date().getTime();
      const target = new Date(nearestHoliday.date).getTime();
      const distance = target - now;

      if (distance < 0) {
        setTimeLeft('Праздник уже наступил! 🎉');
        return;
      }
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      setTimeLeft(`${days} д. ${hours} ч. ${minutes} м. ${seconds} с.`);
    };
    updateTimer();
    const interval = setInterval(updateTimer, 1000);
    return () => clearInterval(interval);
  }, [nearestHoliday]);

  async function loadData() {
    setDataLoading(true);
    const me = session.user.id;
    const { data: profiles } = await db.from('profiles').select('*');
    setProfile(profiles?.find(p => p.id === me) || null);
    setPartner(profiles?.find(p => p.id !== me) || null);
    
    const { data: g, error } = await db.rpc('get_gifts');
    if (!error) setGifts(g || []);

    const { data: h } = await db.from('holidays').select('*').not('date', 'is', null);
    
    const dbHolidays = h || [];
    const milestones = getRelationshipMilestones();
    const allEvents = [...dbHolidays, ...milestones];

    if (allEvents.length > 0) {
      const upcoming = allEvents
        .map(x => ({ ...x, dateObj: new Date(x.date) }))
        .filter(x => x.dateObj >= new Date(new Date().setHours(0,0,0,0)))
        .sort((a, b) => a.dateObj - b.dateObj);
        
      if (upcoming.length > 0) setNearestHoliday(upcoming[0]);
    }
    
    setDataLoading(false);
  }

  async function togglePurchase(giftId) {
    const gift = gifts.find(g => g.id === giftId);
    const isBuying = gift && !gift.is_purchased;

    const { error } = await db.rpc('toggle_purchase', { gift_id: giftId });
    if (error) { alert('Ошибка: ' + error.message); return; }
    
    if (isBuying && window.confetti) {
      window.confetti({ 
        particleCount: 150, 
        spread: 80, 
        origin: { y: 0.6 },
        colors: ['#FF6B9D', '#E62429', '#9B5DE5', '#FFBE0B']
      });
    }

    await loadData();
  }

  async function deleteGift(giftId) {
    const { error } = await db.rpc('delete_gift', { gift_id: giftId });
    if (error) { alert('Ошибка удаления: ' + error.message); return; }
    await loadData();
  }

  function getAvatarUrl(p) {
    if (!p) return null;
    if (p.name.toLowerCase().includes('влад') || p.theme === 'spiderman') return SPIDER_AVATAR;
    if (p.name.toLowerCase().includes('юл') || p.theme === 'hellokitty') return KITTY_AVATAR;
    return null;
  }

  function handleRandomGift() {
    const available = gifts.filter(g => g.for_user !== session.user.id && !g.is_purchased);
    if (available.length === 0) { alert('В списке партнёра пока нет некупленных подарков!'); return; }
    const mustHaves = available.filter(g => g.priority === 'must');
    const pool = mustHaves.length > 0 ? mustHaves : available;
    setRandomGift(pool[Math.floor(Math.random() * pool.length)]);
  }

  function handleEditClick(gift) {
    setEditingGift(gift);
    setShowForm(true);
  }

  function handleCloseForm() {
    setShowForm(false);
    setEditingGift(null);
  }

  if (appLoading || dataLoading) return React.createElement(LoadingScreen);

  if (!session) return React.createElement(React.Fragment, null,
    React.createElement(PolaroidBoard),
    React.createElement(Login)
  );

  const myWishlist = gifts.filter(g => g.for_user === session.user.id);
  const partnerWishlist = gifts.filter(g => g.for_user !== session.user.id);

  const myAvatar = getAvatarUrl(profile);
  const partnerAvatar = getAvatarUrl(partner);
  const myName = formatName(profile?.name) || 'Я';
  const partnerName = formatName(partner?.name) || 'Партнёр';

  const totalWishes = gifts.length;
  const purchasedCount = gifts.filter(g => g.is_purchased).length;
  const totalSum = gifts.reduce((acc, curr) => acc + (curr.price || 0), 0);

  return React.createElement(React.Fragment, null,
    React.createElement(PolaroidBoard),
    React.createElement('div', { className: 'app' },
      React.createElement('header', null,
        React.createElement('h1', null, 
          React.createElement('div', { className: 'avatar' }, myAvatar ? React.createElement('img', { src: myAvatar, alt: 'me' }) : (profile?.emoji || '💗')),
          React.createElement('span', null, myName),
          React.createElement('span', null, '+'),
          React.createElement('div', { className: 'avatar' }, partnerAvatar ? React.createElement('img', { src: partnerAvatar, alt: 'partner' }) : (partner?.emoji || '💗')),
          React.createElement('span', null, partnerName)
        ),
        React.createElement('button', { className: 'logout', onClick: () => db.auth.signOut() }, 'Выйти')
      ),

      React.createElement('div', { className: 'info-panel' },
        nearestHoliday && React.createElement('div', { className: 'timer-box' },
          React.createElement('div', { className: 'timer-title' }, (nearestHoliday.emoji || '🎉') + ' До события «' + nearestHoliday.title + '» осталось:'),
          React.createElement('div', { className: 'timer-digits' }, timeLeft)
        ),
        React.createElement('div', { className: 'stats-box' },
          React.createElement('div', { className: 'stat-row' }, React.createElement('span', null, 'Всего желаний:'), React.createElement('span', null, totalWishes)),
          React.createElement('div', { className: 'stat-row' }, React.createElement('span', null, 'Уже куплено:'), React.createElement('span', null, purchasedCount)),
          React.createElement('div', { className: 'stat-row' }, React.createElement('span', null, 'Общая сумма:'), React.createElement('span', null, totalSum + ' ₽'))
        )
      ),
      
      React.createElement('div', { className: 'actions-row' },
        React.createElement('button', { className: 'add-btn', onClick: () => { setEditingGift(null); setShowForm(true); } }, '➕ Добавить подарок'),
        React.createElement('button', { className: 'surprise-btn', onClick: handleRandomGift }, '🎲 Подари мне сюрприз')
      ),

      showForm && React.createElement(GiftForm, { 
        me: session.user.id, 
        partner: partner, 
        partnerName: partnerName, 
        initialData: editingGift,
        onClose: handleCloseForm, 
        onSaved: () => { handleCloseForm(); loadData(); },
        onDelete: (id) => { deleteGift(id); handleCloseForm(); }
      }),
      
      randomGift && React.createElement('div', { className: 'modal-bg', onClick: () => setRandomGift(null) },
        React.createElement('div', { className: 'modal', onClick: e => e.stopPropagation() },
          React.createElement('h2', null, '🎁 Твой сюрприз!'),
          React.createElement('div', { className: 'surprise-result' },
            React.createElement('div', { className: 'icon' }, '🎉'),
            React.createElement('h3', null, randomGift.title),
            randomGift.price != null && React.createElement('p', null, 'Цена: ' + randomGift.price + ' ₽'),
            React.createElement('p', { style: { marginTop: '10px', color: '#666' } }, 'Это отличная идея для подарка!'),
            React.createElement('button', { className: 'buy-btn', style: { marginTop: '20px' }, onClick: () => { togglePurchase(randomGift.id); setRandomGift(null); } }, '🛒 Я дарю это!')
          ),
          React.createElement('div', { className: 'modal-actions' }, React.createElement('button', { type: 'button', onClick: () => setRandomGift(null) }, 'Закрыть'))
        )
      ),

      React.createElement('section', { className: 'lists' },
        React.createElement('div', { className: 'column' },
          React.createElement('h2', null, '🎁 Что я хочу'),
          myWishlist.length === 0 && React.createElement('p', { className: 'empty' }, 'Пока пусто. Добавь мечту! 💭'),
          myWishlist.map(g => React.createElement(GiftCard, { 
            key: g.id, gift: g, mode: 'mine', 
            onEdit: (g.created_by === session.user.id) ? () => handleEditClick(g) : null,
            onDelete: (g.created_by === session.user.id) ? () => deleteGift(g.id) : null 
          }))
        ),
        React.createElement('div', { className: 'column' },
          React.createElement('h2', null, '💝 Чего хочет ' + partnerName),
          partnerWishlist.length === 0 && React.createElement('p', { className: 'empty' }, 'Пока пусто 🎀'),
          partnerWishlist.map(g => React.createElement(GiftCard, { 
            key: g.id, gift: g, mode: 'partner', 
            onToggle: () => togglePurchase(g.id), 
            onEdit: (g.created_by === session.user.id) ? () => handleEditClick(g) : null,
            onDelete: (g.created_by === session.user.id) ? () => deleteGift(g.id) : null 
          }))
        )
      )
    )
  );
}

function Login() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleLogin(e) {
    e.preventDefault(); setBusy(true); setError('');
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
    setBusy(false);
  }

  return React.createElement('div', { className: 'center' },
    React.createElement('form', { className: 'login-form', onSubmit: handleLogin },
      React.createElement('h1', null, '🕷️ Владик + Юлька Шпулька 🎀'),
      React.createElement('p', { className: 'subtitle' }, 'Наш семейный вишлист'),
      React.createElement('input', { type: 'email', placeholder: 'email', value: email, onChange: e => setEmail(e.target.value), required: true }),
      React.createElement('input', { type: 'password', placeholder: 'пароль', value: password, onChange: e => setPassword(e.target.value), required: true }),
      error && React.createElement('p', { className: 'error' }, error),
      React.createElement('button', { type: 'submit', disabled: busy }, busy ? '...' : 'Войти 💗')
    )
  );
}

function GiftCard({ gift, mode, onToggle, onEdit, onDelete }) {
  const getCatClass = (cat) => 'badge cat-' + (cat || 'other');
  const getPrioClass = (prio) => 'badge prio-' + (prio || 'nice');

  return React.createElement('div', { className: 'card ' + (gift.is_purchased ? 'purchased' : '') },
    gift.image_url && React.createElement('img', { src: gift.image_url, alt: gift.title }),
    React.createElement('h3', null, gift.title),
    gift.description && React.createElement('p', null, gift.description),
    React.createElement('div', { className: 'meta' },
      gift.price != null && React.createElement('span', { className: 'badge price' }, gift.price + ' ₽'),
      gift.category && React.createElement('span', { className: getCatClass(gift.category) }, CATEGORIES[gift.category]),
      gift.priority && React.createElement('span', { className: getPrioClass(gift.priority) }, PRIORITIES[gift.priority])
    ),
    gift.url && React.createElement('a', { href: gift.url, target: '_blank', rel: 'noopener noreferrer' }, 'Открыть ссылку →'),
    
    mode === 'partner' && onToggle && React.createElement('button', { className: 'buy-btn', onClick: onToggle }, gift.is_purchased ? '✅ Куплено (отменить?)' : '🛒 Отметить купленным'),
    
    (onEdit || onDelete) && React.createElement('div', { className: 'card-actions' },
      onEdit && React.createElement('button', { className: 'edit-btn', onClick: onEdit }, '✏️ Изменить'),
      onDelete && React.createElement('button', { className: 'delete-btn', onClick: onDelete }, '🗑 Удалить')
    )
  );
}

function GiftForm({ me, partner, partnerName, initialData, onClose, onSaved, onDelete }) {
  const [form, setForm] = useState(initialData ? {
    title: initialData.title || '',
    description: initialData.description || '',
    url: initialData.url || '',
    price: initialData.price || '',
    category: initialData.category || '',
    priority: initialData.priority || '',
    for_user: initialData.for_user || me
  } : { title: '', description: '', url: '', price: '', category: '', priority: '', for_user: me });
  
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  async function handleSubmit(e) {
    e.preventDefault(); setBusy(true); setErr('');
    const payload = {
      title: form.title, description: form.description || null, url: form.url || null,
      price: form.price ? Number(form.price) : null, category: form.category || null,
      priority: form.priority || null, for_user: form.for_user
    };

    let error;
    if (initialData) {
      // Добавил .select() чтобы база точно вернула результат и мы поймали ошибку, если RLS блокирует
      const res = await db.from('gifts').update(payload).eq('id', initialData.id).select();
      error = res.error;
    } else {
      payload.created_by = me;
      const res = await db.from('gifts').insert(payload).select();
      error = res.error;
    }

    setBusy(false);
    if (error) { setErr(error.message); return; }
    onSaved();
  }

  return React.createElement('div', { className: 'modal-bg', onClick: onClose },
    React.createElement('form', { className: 'modal', onClick: e => e.stopPropagation(), onSubmit: handleSubmit },
      React.createElement('h2', null, initialData ? 'Редактировать подарок ✏️' : 'Новый подарок 🎁'),
      React.createElement('label', null, 'Кому?',
        React.createElement('select', { value: form.for_user, onChange: e => setForm({...form, for_user: e.target.value}) },
          React.createElement('option', { value: me }, 'Мне (в мой вишлист)'),
          partner && React.createElement('option', { value: partner.id }, partner.emoji + ' ' + partnerName)
        )
      ),
      React.createElement('label', null, 'Название*', React.createElement('input', { required: true, value: form.title, onChange: e => setForm({...form, title: e.target.value}) })),
      React.createElement('label', null, 'Описание', React.createElement('textarea', { value: form.description, onChange: e => setForm({...form, description: e.target.value}) })),
      React.createElement('label', null, 'Ссылка на товар', React.createElement('input', { type: 'url', value: form.url, onChange: e => setForm({...form, url: e.target.value}), placeholder: 'https://...' })),
      React.createElement('label', null, 'Цена, ₽', React.createElement('input', { type: 'number', value: form.price, onChange: e => setForm({...form, price: e.target.value}) })),
      React.createElement('label', null, 'Категория',
        React.createElement('select', { value: form.category, onChange: e => setForm({...form, category: e.target.value}) },
          React.createElement('option', { value: '' }, '— Выбери —'),
          Object.entries(CATEGORIES).map(([k,v]) => React.createElement('option', { key: k, value: k }, v))
        )
      ),
      React.createElement('label', null, 'Приоритет',
        React.createElement('select', { value: form.priority, onChange: e => setForm({...form, priority: e.target.value}) },
          React.createElement('option', { value: '' }, '— Выбери —'),
          Object.entries(PRIORITIES).map(([k,v]) => React.createElement('option', { key: k, value: k }, v))
        )
      ),
      err && React.createElement('p', { className: 'error' }, err),
      React.createElement('div', { className: 'modal-actions' },
        React.createElement('button', { type: 'button', onClick: onClose }, 'Отмена'),
        React.createElement('button', { type: 'submit', disabled: busy }, busy ? '...' : 'Сохранить 💗')
      ),
      initialData && React.createElement('button', { 
        type: 'button', 
        onClick: () => { if(window.confirm('Точно удалить?')) onDelete(initialData.id); },
        style: { marginTop: '16px', width: '100%', background: 'none', border: 'none', color: '#E62429', textDecoration: 'underline', cursor: 'pointer', fontSize: '14px' }
      }, '🗑 Удалить этот подарок')
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
