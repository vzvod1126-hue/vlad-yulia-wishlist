<script>
const { useState, useEffect } = React;
const { createClient } = window.supabase;

const SUPABASE_URL = 'https://ufxkmdyqggtzehdgrlrq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qztayszdGjUWfJ3vdJiNLA_7yLft1vo';

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CATEGORIES = { under2000: '💰 до 2000', big: '💎 крупный', handmade: '🎨 handmade', experience: '✨ впечатление', other: '🎁 прочее' };
const PRIORITIES = { must: '🔥 очень хочу', nice: '🙂 было бы славно', dream: '🌟 мечта' };
const PRIORITY_WEIGHT = { must: 3, dream: 2, nice: 1 };

const SPIDER_AVATAR = 'https://i.postimg.cc/nsKzLvcG/e68292b7dce9918224d7a43246c4f4f6-(1).jpg';
const KITTY_AVATAR = 'https://i.postimg.cc/94H0VxVg/04c2467f385af626b7edd1c408596c26.jpg';

const COLLAGES = [
  'https://i.postimg.cc/Pp5YKkbp/IMG-20261108-211354-702.jpg',
  'https://i.postimg.cc/MMpVt80f/IMG-20261108-211354-805.jpg',
  'https://i.postimg.cc/p9ZKDdjj/IMG-20261108-211355-114.jpg',
  'https://i.postimg.cc/06f7pNSG/IMG-20261108-211355-366.jpg'
];

const RELATIONSHIP_START = new Date('2026-08-20T00:00:00'); 

function getNextOccurrence(month, day) {
  const now = new Date();
  now.setHours(0,0,0,0);
  let year = now.getFullYear();
  let target = new Date(year, month - 1, day);
  if (target < now) target = new Date(year + 1, month - 1, day);
  return target;
}

function getAllEvents() {
  const events = [];
  const now = new Date();
  now.setHours(0,0,0,0);

  events.push({ title: 'Новый год', date: getNextOccurrence(1, 1), emoji: '🎄' });
  events.push({ title: '14 февраля', date: getNextOccurrence(2, 14), emoji: '💝' });
  events.push({ title: '23 февраля', date: getNextOccurrence(2, 23), emoji: '🎖️' });
  events.push({ title: '8 марта', date: getNextOccurrence(3, 8), emoji: '🌷' });
  events.push({ title: 'День рождения Юльки', date: getNextOccurrence(7, 29), emoji: '🎀' });
  events.push({ title: 'День рождения Владика', date: getNextOccurrence(8, 16), emoji: '🕷️' });

  for (let i = 1; i <= 10; i++) {
    const months = i * 6;
    const targetDate = new Date(RELATIONSHIP_START.getFullYear(), RELATIONSHIP_START.getMonth() + months, RELATIONSHIP_START.getDate());
    if (targetDate > now) {
      let label = '';
      if (months % 12 === 0) {
        const years = months / 12;
        if (years === 1) label = '1 год вместе';
        else if (years > 1 && years < 5) label = years + ' года вместе';
        else label = years + ' лет вместе';
      } else {
        label = months + ' месяцев вместе';
      }
      events.push({ title: label, date: targetDate, emoji: '💍' });
    }
  }
  return events.sort((a, b) => a.date - b.date);
}

function formatName(name) {
  if (!name) return '';
  const lower = name.toLowerCase();
  if (lower === 'влад') return 'Владик';
  if (lower === 'юля') return 'Юлька Шпулька';
  return name;
}

function sortByPriority(arr) {
  return [...arr].sort((a, b) => (PRIORITY_WEIGHT[b.priority] || 0) - (PRIORITY_WEIGHT[a.priority] || 0));
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('Скопировано! 💌');
  }).catch(() => {
    alert('Не удалось скопировать 😔');
  });
}

function PolaroidBoard() {
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    const interval = setInterval(() => { setOffset(prev => (prev + 1) % COLLAGES.length); }, 5000);
    return () => clearInterval(interval);
  }, []);

  return React.createElement('div', { className: 'polaroid-board' },
    React.createElement('div', { className: 'polaroid pol-1' }, React.createElement('img', { src: COLLAGES[offset % 4], alt: 'collage' })),
    React.createElement('div', { className: 'polaroid pol-2' }, React.createElement('img', { src: COLLAGES[(offset + 1) % 4], alt: 'collage' })),
    React.createElement('div', { className: 'polaroid pol-3' }, React.createElement('img', { src: COLLAGES[(offset + 2) % 4], alt: 'collage' })),
    React.createElement('div', { className: 'polaroid pol-4' }, React.createElement('img', { src: COLLAGES[(offset + 3) % 4], alt: 'collage' }))
  );

function LoadingScreen() {
  const [percent, setPercent] = useState(0);
  useEffect(() => {
    const interval = setInterval(() => {
      setPercent(p => {
        if (p >= 100) { clearInterval(interval); return 100; }
        return p + 5;
      });
    }, 50);
    return () => clearInterval(interval);
  }, []);

  return React.createElement('div', { className: 'loading-screen' },
    React.createElement('h2', null, 'Загрузка ' + percent + '%...'),
    React.createElement('div', { className: 'loading-bar-bg' }, React.createElement('div', { className: 'loading-bar-fill', style: { width: percent + '%' } })),
    React.createElement('div', { className: 'love-text' }, 'Моя любовь к тебе всегда 100% ❤️')
  );
}

function RelationshipTimer() {
  const [time, setTime] = useState({ years: 0, months: 0, days: 0, hours: 0, minutes: 0 });

  useEffect(() => {
    const calculateTime = () => {
      const now = new Date();
      let years = now.getFullYear() - RELATIONSHIP_START.getFullYear();
      let months = now.getMonth() - RELATIONSHIP_START.getMonth();
      let days = now.getDate() - RELATIONSHIP_START.getDate();
      let hours = now.getHours() - RELATIONSHIP_START.getHours();
      let minutes = now.getMinutes() - RELATIONSHIP_START.getMinutes();

      if (minutes < 0) { minutes += 60; hours--; }
      if (hours < 0) { hours += 24; days--; }
      if (days < 0) { 
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate(); 
        months--; 
      }
      if (months < 0) { months += 12; years--; }

      setTime({ years, months, days, hours, minutes });
    };

    calculateTime();
    const interval = setInterval(calculateTime, 30000);
    return () => clearInterval(interval);
  }, []);

  return React.createElement('div', { className: 'timer-box' },
    '💕 Мы вместе уже',
    React.createElement('span', { className: 'timer-value' }, 
      `${time.years} г. ${time.months} мес. ${time.days} дн. ${time.hours} ч. ${time.minutes} мин.`
    )
  );
}
